[project]
name = "money-bot"
version = "1.0.0"
description = "Personal finance assistant in a Telegram chat, backed by a Google Sheet and Claude Code."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "gspread>=6.2.1",
    "requests>=2.34.2",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
