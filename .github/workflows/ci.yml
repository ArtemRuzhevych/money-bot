name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: requirements.txt matches uv.lock
        run: uv export --no-dev --no-hashes --no-annotate --frozen -q -o requirements.txt && git diff --exit-code requirements.txt

  # launcher.py on the host polls the deploy branch, so moving it is the whole deploy.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: git push --force origin HEAD:refs/heads/deploy
